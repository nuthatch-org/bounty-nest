[view.bounties]
description = "Every bounty either board has held, one row each, with its status: open, paid, cancelled or refunded. A bounty_id is unique only on its own board, so read it with board, the contract to call; board_version is that contract's. Bounties are posted on 3.0.0 now, and 2.0.0 is kept for what was posted on it. deployment_id is the subgraph deployment as bytes32 (the Qm hash without its 0x1220 prefix). expires_at is unix seconds, 0 for none; an open bounty past it cannot be paid."

[view.open_bounties]
description = "Bounties still in escrow, largest first, each with the board that holds it. To earn one on 3.0.0: allocate to deployment_id, sync it and present a POI that is not zero. Anyone can then call proveAndDistribute(bounty_id, allocation, proof) on board within about a day of the presentation, the proof being the block header and the receipt of the POIPresented log; a closed allocation is still paid. On 2.0.0 it is distribute(bounty_id, allocation) with the allocation still open."

[view.proven_pois]
description = "Each proof board 3.0.0 has accepted that an allocation presented a POI that was not zero: the allocation, the POI, the block and time it was presented, and when it was proven. An allocation can be paid any bounty on its deployment posted before presented_at."
