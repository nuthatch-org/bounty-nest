[view.bounties]
description = "Every bounty BountyBoard 2.0.0 has held, one row each, with its status: open, paid, cancelled or refunded. deployment_id is the subgraph deployment as bytes32 (the Qm hash without its 0x1220 prefix). expires_at is unix seconds, 0 for none; an open bounty past it cannot be paid."

[view.open_bounties]
description = "Bounties still in escrow, largest first. To earn one: allocate to deployment_id, sync it, present a POI and leave the allocation open; anyone can then call distribute(bounty_id, allocation). check(bounty_id, allocation) on the contract says whether it would pay."
